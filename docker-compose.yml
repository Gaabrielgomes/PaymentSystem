services:
  db:
    image: postgres:16
    container_name: payment_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data

volumes:
  payment_db_data: