name: CI

on:
  pull_request:
    branches: [dev, homolog, main]
  push:
    branches: [dev, homolog, main]

# Cancels an older run of the same branch/PR when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  test:
    name: test
    runs-on: ubuntu-latest
    # Dummy values so settings load; Testcontainers starts its own
    # Postgres/RabbitMQ with their own credentials.
    env:
      POSTGRES_USER: ci_user
      POSTGRES_PASSWORD: ci_password
      POSTGRES_DB: payments
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5433/payments
      RABBITMQ_USER: ci_user
      RABBITMQ_PASSWORD: ci_password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v
